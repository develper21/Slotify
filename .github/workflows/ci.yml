name: CI - Pipline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --ci --runInBand

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/slotify
          JWT_SECRET: ci-only-placeholder-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Type-check
        run: npm run typecheck
